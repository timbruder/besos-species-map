<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Besos River Mouth Interactive Species Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one zoomable grey canvas; four yellow organic fields packed edge to edge; header top-left, legend bottom-right, species card bottom-left. Single deliberate light look. */
:root{
  --canvas:#EFEFEB; --dot:rgba(19,36,18,.13);
  --field:#FEFFDC;
  --ink:#132412; --olive:#324D00; --lime:#E3E100; --orange:#FF6925;
  --muted:rgba(19,36,18,.55);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--canvas);
  background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px);}
#stage.panning{cursor:grabbing}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

/* species nodes */
.node{position:absolute;left:0;top:0;padding:0;margin:0;border:0;background:none;cursor:pointer;font:inherit;color:inherit;
  transform-origin:50% 50%;will-change:transform,opacity;touch-action:none}
.node img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .3s ease;pointer-events:none}
.node:hover img,.node:focus-visible img{transform:scale(1.07) rotate(-2deg)}
.node.dragging{cursor:grabbing;z-index:3}
.node.dragging img{transform:scale(1.12) rotate(3deg);filter:drop-shadow(0 14px 14px rgba(19,36,18,.25))}
.node:focus-visible{outline:none}
.node:focus-visible .pill{box-shadow:0 0 0 3px var(--lime)}
.pill{position:absolute;left:50%;top:88%;transform:translateX(-50%);white-space:nowrap;
  font-size:21px;font-weight:700;letter-spacing:.005em;line-height:1;padding:8px 20px;border-radius:999px;
  background:var(--g-bg);color:var(--g-fg);box-shadow:inset 0 0 0 1.5px var(--g-ol,transparent);transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease}
.node:hover .pill{transform:translateX(-50%) scale(1.08)}
.node.indicator .pill{font-size:28px;padding:10px 28px}
.node.mm-open .pill{box-shadow:inset 0 0 0 1.5px var(--g-ol,transparent),0 0 0 4px var(--orange)}
.node.selected .pill{box-shadow:inset 0 0 0 1.5px var(--g-ol,transparent),0 0 0 4px var(--lime)}

.heading{position:absolute;left:0;top:0;font-weight:700;font-size:44px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;
  display:flex;align-items:center;gap:10px;pointer-events:none;will-change:opacity,transform}
.heading svg{width:38px;height:38px;flex:none}

/* text mind map */
.mm{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;will-change:transform,opacity}
.mm.head{font-size:18px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);
  background:var(--canvas);padding:4px 10px;border-radius:999px}
.mm.item{font-size:22px;font-weight:500;color:var(--ink);background:rgba(254,255,220,.92);padding:3px 9px;border-radius:7px}

/* header */
header{position:fixed;left:24px;top:calc(18px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px;z-index:5;pointer-events:none}
header .logo{width:48px;height:48px;color:var(--orange);flex:none}
header h1{margin:0;font-size:22px;font-weight:400;color:var(--orange);letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
header h1 strong{font-weight:700}
#hint{position:fixed;left:24px;top:calc(80px + env(safe-area-inset-top,0px));z-index:5;margin:0;font-size:13px;color:var(--muted);max-width:46ch;line-height:1.45;
  transition:opacity .6s ease,transform .6s ease;pointer-events:none}
#hint.gone{opacity:0;transform:translateY(-6px)}
#hint b{color:var(--ink);font-weight:600}

/* legend */
#legend{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;grid-template-columns:auto auto;gap:7px 12px;align-items:center;
  font-size:13px;color:var(--ink);background:rgba(239,239,235,.8);backdrop-filter:blur(4px);padding:10px 12px;border-radius:12px;pointer-events:none}
#legend .sw{width:84px;height:12px;border-radius:999px;background:var(--g-bg);box-shadow:inset 0 0 0 1.5px var(--g-ol,transparent)}

/* species card */
#card{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 48px));max-height:calc(100% - 150px);z-index:10;
  display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:var(--g-bg);color:var(--g-fg);box-shadow:inset 0 0 0 2px var(--g-ol,transparent),0 18px 40px rgba(19,36,18,.22);
  opacity:0;transform:translateY(28px) scale(.96);pointer-events:none;transition:opacity .35s ease,transform .5s cubic-bezier(.34,1.56,.64,1),background-color .4s ease,color .4s ease}
#card.show{opacity:1;transform:none;pointer-events:auto}
#card .photo{position:relative;margin:8px 8px 0;border-radius:6px;overflow:hidden;flex:none;background:rgba(0,0,0,.08)}
#card .photo img{display:block;width:100%;height:auto;max-height:220px;object-fit:cover}
#card .close{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:#132412;font-size:18px;line-height:30px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
#card .close:hover{transform:scale(1.12) rotate(90deg)}
#card .close:focus-visible,#card .webbtn:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
#card .body{padding:14px 18px 16px;overflow-y:auto;min-height:0}
#card h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
#card .sci{margin:4px 0 0;font-size:14px;opacity:.8}
#card .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
#card .chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;border:1.5px solid currentColor}
#card .chip.role{background:var(--orange);border-color:var(--orange);color:#fff}
#card .desc{margin:12px 0 0;font-size:15px;line-height:1.5;max-width:60ch}
#card dl{margin:14px 0 0;display:grid;gap:8px;font-size:13.5px;line-height:1.4}
#card dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
#card dd{margin:2px 0 0}
#card .webbtn{margin-top:16px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;cursor:pointer;
  font:600 14px var(--font);padding:12px 14px;border-radius:999px;background:var(--orange);color:#fff;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
#card .webbtn:hover{transform:scale(1.03)}
#card .webbtn .arr{transition:transform .25s ease}
#card .webbtn:hover .arr{transform:translateX(4px)}
#card .soon{margin:10px 0 0;font-size:13px;line-height:1.45}
#card .soon.wiggle{animation:wig .5s ease}
@keyframes wig{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#card .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
#card .credit{margin:0;font-size:11px;line-height:1.4;opacity:.7;min-width:0}
#card .credit a{color:inherit}
#card .cardlogo{width:36px;height:36px;flex:none;color:var(--g-fg)}

@media (max-width:760px){
  header h1{font-size:17px} header .logo{width:38px;height:38px}
  header{left:16px}
  #hint{top:calc(66px + env(safe-area-inset-top,0px));font-size:12px;right:16px;left:16px}
  #legend{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));grid-template-columns:auto auto auto auto;font-size:11px;gap:5px 7px;padding:8px 10px}
  #legend .sw{width:26px;height:10px}
  #card{left:12px;right:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:70%}
}
@media (prefers-reduced-motion:reduce){
  .node img,.pill,#card,#card .close,#card .webbtn{transition:none}
}
</style>
</head>

<script>
(() => {
const D = window.BESOS_DATA;
const SP = D.species;
const G = Object.fromEntries(D.groups.map(g => [g.id, g]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

const stage = document.getElementById('stage');
const world = document.getElementById('world');
const cv = document.getElementById('lines');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
hint.innerHTML = coarse
  ? '<b>Spread two fingers</b> on a yellow field to unfold its food web, <b>pinch</b> to fold it. Tap a species for its photo and connections. Hold and drag to rearrange. Tap the grey canvas to reset.'
  : '<b>Scroll up</b> on a yellow field to unfold its food web, <b>scroll down</b> to fold it. Click a species for its photo and connections. Drag species or fields to rearrange. Click the grey canvas to reset.';

// ---------- legend ----------
const legend = document.getElementById('legend');
D.groups.forEach(g => {
  const sw = document.createElement('span'); sw.className = 'sw'; setGroupVars(sw, g.id);
  const lb = document.createElement('span'); lb.textContent = g.label;
  legend.append(sw, lb);
});
function setGroupVars(el, gid){
  const g = G[gid]; el.style.setProperty('--g-bg', g.bg); el.style.setProperty('--g-fg', g.fg);
  el.style.setProperty('--g-ol', g.outline || 'transparent');
}

// ---------- camera ----------
const cam = {x:0, y:0, s:.4, tx:0, ty:0, ts:.4};
let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
function resize(){ W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2); cv.width = W * DPR; cv.height = H * DPR; }
resize();
addEventListener('resize', () => { resize(); if (!webs.some(w => w.open)) fitStart(false); });
const toWorld = (sx, sy) => [(sx - cam.x) / cam.s, (sy - cam.y) / cam.s];
const pads = () => W < 760 ? {l:16, r:16, t:110, b:120} : {l:40, r:40, t:120, b:40};
function fitBox(b, cap = 1.1){
  const p = pads();
  const s = Math.min((W - p.l - p.r) / (b[2] - b[0]), (H - p.t - p.b) / (b[3] - b[1]), cap);
  cam.ts = s;
  cam.tx = p.l + (W - p.l - p.r - (b[2] - b[0]) * s) / 2 - b[0] * s;
  cam.ty = p.t + (H - p.t - p.b - (b[3] - b[1]) * s) / 2 - b[1] * s;
}

// ---------- webs, nodes ----------
const IND_SIZE = 310, SIZE = 185, IND_BIG = 1.55, BASE_R = 400, GAP = 70;
const webs = D.webs.map((w, wi) => ({
  ...w, wi, open:false,
  x:0, y:0, tx:0, ty:0, vx:0, vy:0, ox:0, oy:0,
  rx: BASE_R, ry: BASE_R * .93, trx: BASE_R, try: BASE_R * .93, vrx:0, vry:0,
  phase: wi * 1.7, nodes: [], links: [], headings: {}, groupNodes:{}
}));
const nodes = [], nodeByEl = new Map();

function mkNode(web, id, size, key, note){
  const s = SP[id], isInd = key === 'ind';
  const el = document.createElement('button');
  el.className = 'node' + (isInd ? ' indicator' : '');
  el.style.width = el.style.height = size + 'px';
  el.setAttribute('aria-label', s.common + ' – ' + s.scientific);
  const img = document.createElement('img'); img.src = s.illustration; img.alt = ''; img.draggable = false;
  const pill = document.createElement('span'); pill.className = 'pill'; pill.textContent = s.common;
  setGroupVars(pill, s.group);
  el.append(img, pill);
  world.appendChild(el);
  const n = {web, id, size, key, note, isInd, el, lx:0, ly:0, ux:0, uy:0,
    px:0, py:0, vx:0, vy:0, tpx:0, tpy:0, sc: isInd ? IND_BIG : .2, vs:0, tsc: isInd ? IND_BIG : .2,
    op: isInd ? 1 : 0, top: isInd ? 1 : 0, delayUntil:0, mm:null, pillW: s.common.length * 12 + 44};
  el.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); nodeClick(n); } });
  nodes.push(n); web.nodes.push(n); nodeByEl.set(el, n);
  return n;
}

  for (let i = 0; i <= N; i++){
    const p = pts[i % N], q = pts[(i + 1) % N], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    if (i === 0) ctx.moveTo(m[0], m[1]); else ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]);
  }
  ctx.closePath();
}
function curveBetween(A, B, bend){
  let [x1, y1] = nodeWorld(A), [x2, y2] = nodeWorld(B);
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const ra = A.size * .34 * A.sc, rb = B.size * .34 * B.sc;
  x1 += dx / len * ra; y1 += dy / len * ra; x2 -= dx / len * rb; y2 -= dy / len * rb;
  return [x1, y1, (x1 + x2) / 2 - dy * bend, (y1 + y2) / 2 + dx * bend, x2, y2];
}
function sample(c, n){
  const [x1, y1, mx, my, x2, y2] = c, pts = [[x1, y1, 0]]; let L = 0;
  for (let i = 1; i <= n; i++){
    const t = i / n, u = 1 - t;
    const x = u*u*x1 + 2*u*t*mx + t*t*x2, y = u*u*y1 + 2*u*t*my + t*t*y2;
    L += Math.hypot(x - pts[i-1][0], y - pts[i-1][1]); pts.push([x, y, L]);
  }
  return pts;
}
function at(pts, d){
  let i = 1; while (i < pts.length - 1 && pts[i][2] < d) i++;
  const a = pts[i-1], b = pts[i], f = (d - a[2]) / ((b[2] - a[2]) || 1);
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, Math.atan2(b[1] - a[1], b[0] - a[0])];
}
const INK = '#132412', ORANGE = '#FF6925';
function drawLink(l, now){
  const op = Math.min(l.a.op, l.b.op); if (op < .02) return;
  const c = curveBetween(l.a, l.b, l.bend);
  ctx.globalAlpha = op;
  if (l.kind === 'shelter' || l.kind === 'compete'){
    ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.quadraticCurveTo(c[2], c[3], c[4], c[5]);
    ctx.strokeStyle = l.kind === 'shelter' ? INK : 'rgba(19,36,18,.45)';
    ctx.lineWidth = l.kind === 'shelter' ? 2.2 : 3; ctx.lineCap = 'round';
    ctx.setLineDash(l.kind === 'shelter' ? [12, 10] : [0.1, 9]);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; return;
  }
  const pts = sample(c, 40), L = pts[pts.length - 1][2];
  const GAPD = 11, speed = 150, T = L / speed, PAUSE = .45, GROW = .8, cyc = T + PAUSE + GROW;
  const tt = reduceMotion || op < .97 ? -1 : ((now / 1000 + l.off) % cyc);
  let eaten = 0, grow = 1, pac = null;
  if (tt >= 0){
    if (tt < T){ eaten = tt / T * L; pac = at(pts, eaten); pac.push(1); }
    else if (tt < T + PAUSE){ eaten = L + 1; pac = at(pts, L); pac.push(1 - (tt - T) / PAUSE); }
    else { grow = (tt - T - PAUSE) / GROW; }
  }
  ctx.fillStyle = INK;
  for (let d = GAPD / 2; d < L; d += GAPD){
    if (d < eaten) continue;
    let r = 2.4;
    if (grow < 1){ const k = Math.min(1, Math.max(0, grow * 1.3 - d / L * .3)); if (d / L > k) continue; r *= Math.min(1, (k - d / L) * 6 + .3); }
    const p = at(pts, d); ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 6.2832); ctx.fill();
  }
  if (pac){
    const [px, py, ang, s] = pac, R = 11 * (0.4 + .6 * s);
    const mouth = (.08 + .32 * Math.abs(Math.sin(now / 90))) * Math.PI;
    ctx.globalAlpha = op * Math.min(1, s * 1.5);
    ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.moveTo(px, py); ctx.arc(px, py, R, ang + mouth, ang - mouth + Math.PI * 2); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawCross(A, B, now, lt = .5){
  const op = Math.min(A.op, B.op); if (op < .3) return;
  const c = curveBetween(A, B, .12);
  ctx.globalAlpha = op * .8;
  ctx.strokeStyle = ORANGE; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.setLineDash([2, 12]); ctx.lineDashOffset = reduceMotion ? 0 : -now / 40;
  ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.quadraticCurveTo(c[2], c[3], c[4], c[5]); ctx.stroke();
  ctx.setLineDash([]); ctx.lineDashOffset = 0;
  const u = 1 - lt, mx = u*u * c[0] + 2*u*lt * c[2] + lt*lt * c[4], my = u*u * c[1] + 2*u*lt * c[3] + lt*lt * c[5];
  ctx.font = '600 20px Inter, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const label = 'same species: ' + SP[A.id].common, tw = ctx.measureText(label).width + 26;
  ctx.fillStyle = ORANGE; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(mx - tw / 2, my - 17, tw, 34, 17); else ctx.rect(mx - tw / 2, my - 17, tw, 34); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(label, mx, my + 1);
  ctx.globalAlpha = 1;
}
function drawMindmapLines(n){
  const mm = n.mm, e = easeOut(mm.t); if (mm.t < .01) return;
  const [x, y] = nodeWorld(n);
  ctx.globalAlpha = Math.min(1, mm.t * 1.4);
  ctx.strokeStyle = 'rgba(255,105,37,.75)'; ctx.lineWidth = 2;
  mm.items.forEach(it => {
    const p = it.parent;
    const ax = p ? x + p.ox * e : x, ay = p ? y + p.oy * e : y;
    let bx = x + it.ox * e, by = y + it.oy * e;
    const sx = p ? ax : ax + (bx - ax) * (n.size * .4 / Math.hypot(bx - ax, by - ay));
    const sy = p ? ay : ay + (by - ay) * (n.size * .4 / Math.hypot(bx - ax, by - ay));
    ctx.beginPath(); ctx.moveTo(sx, sy);
    const mx = (sx + bx) / 2, my = p ? by : (sy + by) / 2;
    ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();
    if (p){ ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.arc(bx, by, 3, 0, 6.2832); ctx.fill(); }
  });
  ctx.globalAlpha = 1;
}
const easeOut = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

// ---------- animation loop ----------
let last = performance.now();
layout(); webs.forEach(w => { w.x = w.tx; w.y = w.ty; }); fitStart(); cam.x = cam.tx; cam.y = cam.ty; cam.s = cam.ts;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!act || act.kind !== 'grey' || !act.moved) if (!pinch) clampCam();
  const camK = 1 - Math.pow(.0009, dt * (reduceMotion ? 3 : 1));
  cam.x += (cam.tx - cam.x) * camK; cam.y += (cam.ty - cam.y) * camK; cam.s += (cam.ts - cam.s) * camK;
  world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
  const ds = 16 * cam.s;
  stage.style.backgroundSize = ds + 'px ' + ds + 'px';
  stage.style.backgroundPosition = cam.x + 'px ' + cam.y + 'px';

  const K = reduceMotion ? 400 : 170, C = reduceMotion ? 40 : 19;
  webs.forEach(w => {
    if (!(act && act.moved && act.kind === 'field' && act.w === w)){
      w.vx += ((w.tx - w.x) * 60 - w.vx * 13) * dt; w.x += w.vx * dt;
      w.vy += ((w.ty - w.y) * 60 - w.vy * 13) * dt; w.y += w.vy * dt;
    }
    w.vrx += ((w.trx - w.rx) * 90 - w.vrx * 13) * dt; w.rx += w.vrx * dt;
    w.vry += ((w.try - w.ry) * 90 - w.vry * 13) * dt; w.ry += w.vry * dt;
    const indH = w.headings.ind; indH.x = 0; indH.y = -(IND_SIZE / 2) * w.ind.sc - 70;
    Object.values(w.headings).forEach(h => {
      h.op += (h.top - h.op) * Math.min(1, dt * 6);
      h.el.style.opacity = h.op.toFixed(3);
      h.el.style.transform = `translate(${w.x + h.x}px,${w.y + h.y}px)${h.center ? ' translateX(-50%)' : ''} scale(${.85 + .15 * h.op})`;
    });
  });
  nodes.forEach(n => {
    const dragging = act && act.moved && act.kind === 'node' && act.n === n;
    if (now >= n.delayUntil && !dragging){
      n.vx += ((n.tpx - n.px) * K - n.vx * C) * dt; n.px += n.vx * dt;
      n.vy += ((n.tpy - n.py) * K - n.vy * C) * dt; n.py += n.vy * dt;
      n.vs += ((n.tsc - n.sc) * K - n.vs * (C - 4)) * dt; n.sc += n.vs * dt;
      n.op += (n.top - n.op) * Math.min(1, dt * (n.top ? 7 : 10));
    }
    const vis = n.op > .01;
    n.el.style.visibility = vis ? 'visible' : 'hidden';
    if (vis){
      const [x, y] = nodeWorld(n);
      n.el.style.opacity = n.op.toFixed(3);
      n.el.style.transform = `translate(${x - n.size / 2}px,${y - n.size / 2}px) scale(${Math.max(.05, n.sc)})`;
    }
    n.el.tabIndex = n.top ? 0 : -1;
    // mind map labels
    if (n.mm){
      const mm = n.mm;
      mm.t += ((mm.target) - mm.t) * Math.min(1, dt * (mm.target ? 5 : 8));
      if (!mm.target && mm.t < .01){ mm.items.forEach(i => i.el.remove()); n.mm = null; }
      else {
        const [x, y] = nodeWorld(n), e = easeOut(mm.t);
        mm.items.forEach((it, i) => {
          const tr = it.anchor === 'l' ? 'translate(0,-50%)' : it.anchor === 'r' ? 'translate(-100%,-50%)' : 'translate(-50%,-50%)';
          it.el.style.opacity = Math.min(1, mm.t * 1.3).toFixed(3);
          it.el.style.transform = `translate(${x + it.ox * e}px,${y + it.oy * e}px) ${tr}`;
        });
      }
    }
  });

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * cam.s, 0, 0, DPR * cam.s, DPR * cam.x, DPR * cam.y);
  const t = reduceMotion ? 0 : now / 1000;
  ctx.fillStyle = '#FEFFDC';
  webs.forEach(w => { blobPath(w, t); ctx.fill(); });
  webs.forEach(w => w.links.forEach(l => drawLink(l, now)));
  nodes.forEach(n => { if (n.mm) drawMindmapLines(n); });
  sharedGroups.forEach((list, gi) => { const v = list.filter(n => n.op > .3); for (let i = 0; i < v.length - 1; i++) drawCross(v[i], v[i + 1], now, [.5, .32, .68][gi % 3]); });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
